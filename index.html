<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Perangkat Ajar PPKn Fase D - F</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h2>Generator Perangkat Ajar Terpadu PPKn</h2>
      <p>Mendukung Fase D (Kelas 7-9), Fase E (Kelas 10), dan Fase F (Kelas 11-12)</p>
    </header>

    <div class="grid-layout">
      <!-- Formulir Parameter -->
      <form id="formPerangkat">
        <label>Nama Guru:</label>
        <input type="text" id="namaGuru" value="Moh. Joharul Yusuf, S.Pd." required>

        <label>Satuan Pendidikan:</label>
        <input type="text" id="satuanPendidikan" value="MA Pesantren Terpadu Al Fauzan Lumajang" required>

        <label>Pilih Fase & Jenjang:</label>
        <select id="pilihFase" onchange="updateKelas()">
          <option value="D">Fase D (MTs / SMP)</option>
          <option value="E" selected>Fase E (MA / SMA - Kelas 10)</option>
          <option value="F">Fase F (MA / SMA - Kelas 11 & 12)</option>
        </select>

        <label>Kelas:</label>
        <select id="pilihKelas">
          <option value="10">Kelas 10</option>
        </select>

        <label>Semester:</label>
        <select id="pilihSemester">
          <option value="Gasal">Semester Gasal</option>
          <option value="Genap">Semester Genap</option>
        </select>

        <label>Materi Pokok / Elemen:</label>
        <input type="text" id="materiPokok" value="Perumusan Pancasila sebagai Dasar Negara" required>

        <label>Dimensi Profil Lulusan (Pilih maks. 3):</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="dimensi" value="Keimanan dan Ketakwaan" checked> Keimanan & Ketakwaan</label>
          <label><input type="checkbox" name="dimensi" value="Kewargaan" checked> Kewargaan</label>
          <label><input type="checkbox" name="dimensi" value="Penalaran Kritis" checked> Penalaran Kritis</label>
          <label><input type="checkbox" name="dimensi" value="Kreativitas"> Kreativitas</label>
          <label><input type="checkbox" name="dimensi" value="Kolaborasi"> Kolaborasi</label>
          <label><input type="checkbox" name="dimensi" value="Kemandirian"> Kemandirian</label>
          <label><input type="checkbox" name="dimensi" value="Kesehatan"> Kesehatan</label>
          <label><input type="checkbox" name="dimensi" value="Komunikasi"> Komunikasi</label>
        </div>

        <label>Panca Cinta (Pilih maks. 3):</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="cinta" value="Cinta Tuhan YME" checked> Cinta Tuhan YME</label>
          <label><input type="checkbox" name="cinta" value="Cinta Bangsa & Negara" checked> Cinta Bangsa & Negara</label>
          <label><input type="checkbox" name="cinta" value="Cinta Ilmu Pengetahuan" checked> Cinta Ilmu Pengetahuan</label>
          <label><input type="checkbox" name="cinta" value="Cinta Diri & Sesama"> Cinta Diri & Sesama</label>
          <label><input type="checkbox" name="cinta" value="Cinta Lingkungan"> Cinta Lingkungan</label>
        </div>

        <button type="button" class="btn" onclick="generatePerangkat()">Susun Perangkat Ajar</button>
      </form>

      <!-- Panel Tampilan Output -->
      <div class="preview-panel">
        <div class="preview-actions">
          <button type="button" class="btn-secondary" onclick="salinPrompt()">Salin Teks</button>
          <button type="button" class="btn-secondary" onclick="window.print()">Cetak Dokumen</button>
        </div>
        <textarea id="outputPrompt" placeholder="Hasil penyusunan perangkat ajar akan muncul di sini..." readonly></textarea>
      </div>
    </div>
  </div>

  <script>
    // Pembaruan Opsi Kelas Berdasarkan Fase
    function updateKelas() {
      const fase = document.getElementById("pilihFase").value;
      const selectKelas = document.getElementById("pilihKelas");
      selectKelas.innerHTML = "";

      const opsiKelas = {
        "D": ["7", "8", "9"],
        "E": ["10"],
        "F": ["11", "12"]
      };

      opsiKelas[fase].forEach(function(k) {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = "Kelas " + k;
        selectKelas.appendChild(opt);
      });
    }

    // Pembuatan Prompt Perangkat Ajar
    function generatePerangkat() {
      const dimensiChecked = Array.from(document.querySelectorAll('input[name="dimensi"]:checked')).map(function(el) { return el.value; });
      const cintaChecked = Array.from(document.querySelectorAll('input[name="cinta"]:checked')).map(function(el) { return el.value; });

      if (dimensiChecked.length > 3 || cintaChecked.length > 3) {
        alert("Peringatan: Maksimal pilih 3 Dimensi Profil Lulusan dan 3 Panca Cinta.");
        return;
      }

      const namaGuru = document.getElementById("namaGuru").value;
      const satuan = document.getElementById("satuanPendidikan").value;
      const fase = document.getElementById("pilihFase").value;
      const jenjang = (fase === "D") ? "MTs / SMP" : "MA / SMA";
      const kelas = document.getElementById("pilihKelas").value;
      const semester = document.getElementById("pilihSemester").value;
      const materi = document.getElementById("materiPokok").value;

      const hasilPrompt = 
`RENCANA PELAKSANAAN PEMBELAJARAN (RPP) TERPADU

INFORMASI UMUM:
- Satuan Pendidikan : ${satuan}
- Nama Guru         : ${namaGuru}
- Mata Pelajaran    : Pendidikan Pancasila dan Kewarganegaraan (PPKn)
- Jenjang / Fase    : ${jenjang} / Fase ${fase}
- Kelas / Semester  : Kelas ${kelas} / Semester ${semester}
- Materi Pokok      : ${materi}
- Alokasi Waktu     : 2 x 45 menit (1 Pertemuan)

A. IDENTIFIKASI PESERTA DIDIK & INTEGRASI PEMBELAJARAN
1. Diferensiasi Mesin Kecerdasan STIFIn:
   - Sensing   : Penguatan memori fakta empiris, data sejarah, dan langkah kerja terstruktur.
   - Thinking  : Penguatan penalaran logis, bagan sistem ketatanegaraan, dan analisis perbandingan aturan hukum.
   - Intuiting : Perancangan konsep kreatif, peta ide masa depan, dan infografis gagasan kebangsaan.
   - Feeling   : Pendalaman empati sosial, nilai toleransi, dan penghayatan kebangsaan melalui dialog kelompok.
   - Insting   : Pengambilan peran penengah, perumusan kesepakatan musyawarah, dan respon cepat resolusi konflik.

2. Integrasi Profil Lulusan Terpilih:
   ${dimensiChecked.map(function(d) { return "- " + d; }).join("\n   ")}

3. Integrasi Kurikulum Berbasis Cinta (Panca Cinta):
   ${cintaChecked.map(function(c) { return "- " + c; }).join("\n   ")}

4. Kontekstual Keislaman & Lingkungan:
   - Penguatan nilai ukhuwwah (Islamiyyah, Wathaniyyah, Basyariyyah) dan moderasi beragama (wasathiyyah, tasamuh).
   - Penguatan komitmen santri menjaga martabat diri, keadilan sosial, dan kelestarian alam lingkungan (Lumajang).

B. DESAIN PEMBELAJARAN
- Pendekatan          : Pembelajaran Mendalam (Deep Learning: Berkesadaran, Bermakna, Menggembirakan).
- Model Pembelajaran  : Problem-Based Learning (PBL) / Kolaboratif Terbimbing.
- Lingkungan & Media  : Ruang kelas interaktif pesantren, naskah rujukan hukum/sejarah, serta lembar kerja digital/cetak.

C. PENGALAMAN BELAJAR
1. Pendahuluan (15 Menit):
   - Pembiasaan adab berdoa, sapaan kasih sayang, dan cek kesadaran emosional santri (Mindfulness).
   - Apersepsi kontekstual nilai kebangsaan santri dan penyampaian tujuan pembelajaran.
2. Kegiatan Inti (60 Menit):
   - Memahami   : Eksplorasi materi ${materi} melalui telaah literatur dan studi kasus nyata.
   - Mengaplikasi: Kerja kelompok berbasis kecenderungan STIFIn dalam menyelesaikan lembar telaah.
   - Merefleksi : Presentasi lintas kelompok, klarifikasi nilai, dan penegasan komitmen karakter santri.
3. Penutup (15 Menit):
   - Penarikan intisari bersama, afirmasi karakter santri negarawan, dan doa penutup majelis.

D. ASESMEN & EVALUASI
- Asesmen Formatif : Lembar observasi keaktifan diskusi, adab keagamaan, dan kerja sama kelompok.
- Asesmen Sumatif  : Soal esai uji nalar kritis (HOTS) mengenai konsep ${materi} beserta rubrik penilaian.`;

      document.getElementById("outputPrompt").value = hasilPrompt;
    }

    // Salin Hasil ke Clipboard
    function salinPrompt() {
      const copyText = document.getElementById("outputPrompt");
      if (!copyText.value) {
        alert("Silakan klik tombol 'Susun Perangkat Ajar' terlebih dahulu.");
        return;
      }
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert("Dokumen berhasil disalin ke clipboard!");
    }
  </script>
</body>
</html>
